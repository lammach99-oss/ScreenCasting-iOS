name: iOS public CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      c1_native_stability:
        description: Run only the matched C1 native stability diagnostics; no IPA
        required: false
        default: false
        type: boolean
      c1_focused_lifecycle:
        description: Focused baseline/candidate lifecycle instrumentation RED or GREEN only
        required: false
        default: false
        type: boolean
      c1_extract_reports:
        description: Extract only the retained completed C1 diagnostic reports; no tests or IPA
        required: false
        default: false
        type: boolean
      c1_extract_source_run:
        description: Completed diagnostic run on the validation branch to extract
        required: false
        default: '37881608414'
        type: string
      c1_baseline_ref:
        description: Exact public object with canonical a48980f AudioManager and NetworkManager bytes
        required: false
        default: ''
        type: string
      build_unsigned_ipa:
        description: Build and upload unsigned iPad IPA
        required: true
        default: true
        type: boolean
      xctest_filter:
        description: Optional comma-separated xcodebuild -only-testing selectors
        required: false
        default: ''
        type: string
      run_xctest:
        description: Run native simulator XCTest before packaging
        required: false
        default: true
        type: boolean
      repeat_count:
        description: Focused XCTest repetitions (1-20)
        required: false
        default: '1'
        type: string

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'ci' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  NATIVE_CACHE_SCHEMA: v1
  OPENSSL_PIN: openssl-3.3.2-98b3bf1433f8f4a29e64ca8b9bd42c58d3d1b98a
  LIBSRTP_PIN: 24b3bf8f19b6f5ab4cd2bcceb4f4064efca86fd5
  OPUS_PIN: ddbe48383984d56acd9e1ab6a090c54ca6b735a6
  IOS_DEPLOYMENT_TARGET: '17.0'
  NATIVE_DEVICE_ARCH: arm64
  NATIVE_SIMULATOR_ARCH: x86_64

jobs:
  prepare-native-deps:
    if: ${{ !inputs.c1_native_stability }}
    name: Prepare verified native dependencies
    runs-on: macos-15-intel
    timeout-minutes: 45
    outputs:
      cache_key: ${{ steps.native-key.outputs.cache_key }}
      xcode_fingerprint: ${{ steps.native-key.outputs.xcode_fingerprint }}
      native_manifest_sha256: ${{ steps.native-manifest.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Compute exact native dependency cache key
        id: native-key
        run: |
          set -euo pipefail
          xcode_fingerprint="$({ xcodebuild -version; xcode-select -p; } | shasum -a 256 | awk '{print substr($1, 1, 16)}')"
          build_config_hash="$({
            shasum -a 256 Client/scripts/build_ios_dependencies.sh
            shasum -a 256 Client/scripts/verify_ios_dependency_artifacts.sh
            shasum -a 256 Client/scripts/native_dependency_helpers.sh
            shasum -a 256 Client/iPadZeroLagDisplay/iPadCasting.xcodeproj/project.pbxproj
            printf '%s\n' \
              "IPHONEOS_DEPLOYMENT_TARGET=$IOS_DEPLOYMENT_TARGET" \
              "DEVICE_ARCH=$NATIVE_DEVICE_ARCH" \
              "SIMULATOR_ARCH=$NATIVE_SIMULATOR_ARCH" \
              'OPENSSL_DEVICE_TARGET=ios64-xcrun' \
              'OPENSSL_SIMULATOR_TARGET=iossimulator-x86_64-xcrun' \
              'CMAKE_SYSTEM_NAME=iOS' \
              'CODE_SIGNING_ALLOWED=NO' \
              'CODE_SIGNING_REQUIRED=NO'
          } | shasum -a 256 | awk '{print substr($1, 1, 16)}')"
          cache_key="native-ios-${NATIVE_CACHE_SCHEMA}-${RUNNER_OS}-${RUNNER_ARCH}-${xcode_fingerprint}-${OPENSSL_PIN}-${LIBSRTP_PIN}-${OPUS_PIN}-${build_config_hash}"
          echo "cache_key=$cache_key" >> "$GITHUB_OUTPUT"
          echo "xcode_fingerprint=$xcode_fingerprint" >> "$GITHUB_OUTPUT"
          echo "NATIVE_CACHE_SCHEMA=$NATIVE_CACHE_SCHEMA"
          echo "XCODE_FINGERPRINT=$xcode_fingerprint"
          echo "NATIVE_CACHE_KEY=$cache_key"
      - name: Start native dependency cache restore timer
        id: cache-restore-start
        run: echo "started_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Restore exact native dependency cache
        id: native-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: Client/ThirdPartyBuild
          key: ${{ steps.native-key.outputs.cache_key }}
      - name: Report native dependency cache result
        env:
          CACHE_HIT: ${{ steps.native-cache-restore.outputs.cache-hit }}
          STARTED_EPOCH: ${{ steps.cache-restore-start.outputs.started_epoch }}
        run: |
          set -euo pipefail
          echo "CACHE_RESTORE_SECONDS=$(( $(date +%s) - STARTED_EPOCH ))"
          if [[ "$CACHE_HIT" == true ]]; then
            echo 'Native dependency cache: HIT'
          else
            echo 'Native dependency cache: MISS'
          fi
      - name: Clear generated dependency root on cache miss
        if: steps.native-cache-restore.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/Client/ThirdPartyBuild"
          mkdir -p "$GITHUB_WORKSPACE/Client/ThirdPartyBuild"
      - name: Build pinned native dependencies on cache miss
        if: steps.native-cache-restore.outputs.cache-hit != 'true'
        env:
          SCREENCASTING_DEP_CACHE: ${{ github.workspace }}/Client/ThirdPartyBuild
        run: |
          set -euo pipefail
          started_epoch=$(date +%s)
          ./Client/scripts/build_ios_dependencies.sh
          echo "NATIVE_DEPENDENCY_BUILD_SECONDS=$(( $(date +%s) - started_epoch ))"
          echo 'OpenSSL build: EXECUTED'
          echo 'libsrtp build: EXECUTED'
          echo 'Opus build: EXECUTED'
      - name: Report native dependency cache-hit compilation skip
        if: steps.native-cache-restore.outputs.cache-hit == 'true'
        run: |
          echo 'OpenSSL build: SKIPPED'
          echo 'libsrtp build: SKIPPED'
          echo 'Opus build: SKIPPED'
      - name: Strictly verify restored or built native dependencies
        id: native-verify
        env:
          DEP_ROOT: ${{ github.workspace }}/Client/ThirdPartyBuild
        run: |
          set -euo pipefail
          started_epoch=$(date +%s)
          ./Client/scripts/verify_ios_dependency_artifacts.sh \
            "$DEP_ROOT/xcframeworks" "$DEP_ROOT/build"
          echo "NATIVE_DEPENDENCY_VERIFY_SECONDS=$(( $(date +%s) - started_epoch ))"
          echo 'NATIVE_DEPENDENCY_VERIFY=PASS'
      - name: Remove source clones before cache save and artifact staging
        env:
          DEP_ROOT: ${{ github.workspace }}/Client/ThirdPartyBuild
        run: |
          set -euo pipefail
          rm -rf "$DEP_ROOT/src"
          [[ ! -e "$DEP_ROOT/src" ]]
      - name: Re-verify cache-safe dependency tree after source cleanup
        env:
          DEP_ROOT: ${{ github.workspace }}/Client/ThirdPartyBuild
        run: |
          set -euo pipefail
          started_epoch=$(date +%s)
          [[ ! -e "$DEP_ROOT/src" ]]
          ./Client/scripts/verify_ios_dependency_artifacts.sh \
            "$DEP_ROOT/xcframeworks" "$DEP_ROOT/build"
          echo "NATIVE_DEPENDENCY_CACHE_VERIFY_SECONDS=$(( $(date +%s) - started_epoch ))"
          echo 'NATIVE_DEPENDENCY_CACHE_CONTENTS=PASS'
      - name: Save verified native dependency cache
        if: ${{ steps.native-cache-restore.outputs.cache-hit != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: Client/ThirdPartyBuild
          key: ${{ steps.native-key.outputs.cache_key }}
      - name: Stage verified native dependency artifact and manifest
        id: native-manifest
        env:
          DEP_ROOT: ${{ github.workspace }}/Client/ThirdPartyBuild
          PUBLIC_SHA: ${{ github.sha }}
          CACHE_SCHEMA: ${{ env.NATIVE_CACHE_SCHEMA }}
          CACHE_KEY: ${{ steps.native-key.outputs.cache_key }}
          XCODE_FINGERPRINT: ${{ steps.native-key.outputs.xcode_fingerprint }}
          OPENSSL_PIN: ${{ env.OPENSSL_PIN }}
          LIBSRTP_PIN: ${{ env.LIBSRTP_PIN }}
          OPUS_PIN: ${{ env.OPUS_PIN }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/native-deps-artifact"
          rm -rf "$stage"
          mkdir -p "$stage/Client"
          cp -R "$DEP_ROOT" "$stage/Client/ThirdPartyBuild"
          bash ./Client/scripts/compute_native_dependency_manifest.sh \
            "$stage/Client/ThirdPartyBuild" "$stage/native-deps.manifest.txt"
          source ./Client/scripts/native_dependency_helpers.sh
          manifest_sha256="$(native_dependency_sha256 "$stage/native-deps.manifest.txt" | awk '{print $1}')"
          echo "manifest_sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"
          echo "NATIVE_DEPENDENCY_MANIFEST_SHA256=$manifest_sha256"
      - name: Upload verified native dependency artifact
        uses: actions/upload-artifact@v7
        with:
          name: ScreenCasting-native-deps
          path: |
            ${{ runner.temp }}/native-deps-artifact/Client/ThirdPartyBuild
            ${{ runner.temp }}/native-deps-artifact/native-deps.manifest.txt
          if-no-files-found: error
          retention-days: 3

  build-and-test:
    if: ${{ !inputs.c1_native_stability }}
    name: Build and XCTest
    needs: prepare-native-deps
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Verify iPad-only target
        run: ./Client/scripts/verify_ipad_target.sh
      - name: Verify identity persistence boundary
        run: |
          if grep -En 'UserDefaults|FileManager|NSKeyedArchiver|write\(to:' Client/iPadZeroLagDisplay/USBServerIdentity.swift; then
            echo 'USB identity must remain Security/Keychain-backed' >&2
            exit 1
          fi
          grep -q 'SystemKeychainBackend' Client/iPadZeroLagDisplay/USBServerIdentity.swift
          if grep -En 'testRecover\(|TestRecoveryState|testCertificateInsertStatus' Client/iPadZeroLagDisplay/USBServerIdentity.swift Client/iPadZeroLagDisplayTests/USBServerIdentityTests.swift; then
            echo 'disconnected recovery test seam remains' >&2
            exit 1
          fi
      - name: Run fast feedback workflow fixtures
        run: ./Client/scripts/test_workflow_fast_feedback.sh
      - name: Run deterministic IPA validator fixtures
        run: ./Client/scripts/test_check_ipa.sh
      - name: Run deterministic device dependency search fixtures
        run: ./Client/scripts/test_verify_device_dependency_search_paths.sh
      - name: Download verified native dependency artifact
        uses: actions/download-artifact@v8
        with:
          name: ScreenCasting-native-deps
          path: ${{ runner.temp }}/native-deps-download
      - name: Verify and install native dependency artifact
        env:
          EXPECTED_PUBLIC_SHA: ${{ github.sha }}
          EXPECTED_CACHE_KEY: ${{ needs.prepare-native-deps.outputs.cache_key }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.prepare-native-deps.outputs.native_manifest_sha256 }}
        run: |
          set -euo pipefail
          started_epoch=$(date +%s)
          bash ./Client/scripts/verify_native_dependency_artifact.sh \
            "$RUNNER_TEMP/native-deps-download" "$GITHUB_WORKSPACE/Client/ThirdPartyBuild"
          ./Client/scripts/verify_ios_dependency_artifacts.sh \
            "$GITHUB_WORKSPACE/Client/ThirdPartyBuild/xcframeworks" \
            "$GITHUB_WORKSPACE/Client/ThirdPartyBuild/build"
          echo "NATIVE_DEPENDENCY_ARTIFACT_VERIFY_SECONDS=$(( $(date +%s) - started_epoch ))"
          echo 'NATIVE_DEPENDENCY_CONSUMER_VERIFY=PASS'
      - name: Build unsigned iOS Simulator app
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_xctest != false }}
        run: |
          set -euo pipefail
          started_epoch=$(date +%s)
          xcodebuild -project Client/iPadZeroLagDisplay/iPadCasting.xcodeproj \
            -scheme iPadCasting -destination 'generic/platform=iOS Simulator' \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          echo "SIMULATOR_BUILD_SECONDS=$(( $(date +%s) - started_epoch ))"
      - name: Run XCTest
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_xctest != false }}
        env:
          XCTEST_FILTER: ${{ inputs.xctest_filter }}
          REPEAT_COUNT: ${{ inputs.repeat_count || '1' }}
        run: |
          set -euo pipefail
          started_epoch=$(date +%s)
          destination=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(("platform=iOS Simulator,id="+device["udid"]+",arch=x86_64" for devices in data.get("devices", {}).values() for device in devices if device.get("isAvailable") and "iPad" in device.get("name", "")), ""))')
          test -n "$destination"
          [[ "$REPEAT_COUNT" =~ ^([1-9]|1[0-9]|20)$ ]]
          test_args=()
          if [[ -n "$XCTEST_FILTER" ]]; then
            IFS=',' read -r -a selectors <<< "$XCTEST_FILTER"
            for selector in "${selectors[@]}"; do
              [[ -n "$selector" ]]
              test_args+=("-only-testing:$selector")
            done
          else
            [[ "$REPEAT_COUNT" == 1 ]]
          fi
          failed=0
          for ((iteration=1; iteration<=REPEAT_COUNT; iteration++)); do
            if xcodebuild test -project Client/iPadZeroLagDisplay/iPadCasting.xcodeproj \
              -scheme iPadCasting -destination "$destination" \
              ARCHS=x86_64 ONLY_ACTIVE_ARCH=YES \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ${test_args[@]+"${test_args[@]}"}; then
              echo "XCTEST_ITERATION=$iteration RESULT=PASS"
            else
              echo "XCTEST_ITERATION=$iteration RESULT=FAIL"
              failed=1
            fi
          done
          echo "XCTEST_SECONDS=$(( $(date +%s) - started_epoch ))"
          exit "$failed"

  build-unsigned-ipad-app:
    name: Build unsigned iPad app
    needs: [prepare-native-deps, build-and-test]
    if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_unsigned_ipa == true)) && needs.prepare-native-deps.result == 'success' && needs.build-and-test.result == 'success' }}
    runs-on: macos-15-intel
    timeout-minutes: 45
    outputs:
      app_manifest_sha256: ${{ steps.app-manifest.outputs.manifest_sha256 }}
      native_manifest_sha256: ${{ needs.prepare-native-deps.outputs.native_manifest_sha256 }}
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Verify iPad-only target
        run: ./Client/scripts/verify_ipad_target.sh
      - name: Download verified native dependency artifact
        uses: actions/download-artifact@v8
        with:
          name: ScreenCasting-native-deps
          path: ${{ runner.temp }}/native-deps-download
      - name: Verify and install native dependency artifact
        env:
          EXPECTED_PUBLIC_SHA: ${{ github.sha }}
          EXPECTED_CACHE_KEY: ${{ needs.prepare-native-deps.outputs.cache_key }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.prepare-native-deps.outputs.native_manifest_sha256 }}
        run: |
          set -euo pipefail
          started_epoch=$(date +%s)
          bash ./Client/scripts/verify_native_dependency_artifact.sh \
            "$RUNNER_TEMP/native-deps-download" "$GITHUB_WORKSPACE/Client/ThirdPartyBuild"
          ./Client/scripts/verify_ios_dependency_artifacts.sh \
            "$GITHUB_WORKSPACE/Client/ThirdPartyBuild/xcframeworks" \
            "$GITHUB_WORKSPACE/Client/ThirdPartyBuild/build"
          echo "NATIVE_DEPENDENCY_ARTIFACT_VERIFY_SECONDS=$(( $(date +%s) - started_epoch ))"
          echo 'NATIVE_DEPENDENCY_CONSUMER_VERIFY=PASS'
      - name: Verify device dependency search paths
        run: |
          set -euo pipefail
          xcodebuild -project Client/iPadZeroLagDisplay/iPadCasting.xcodeproj \
            -scheme iPadCasting -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -showBuildSettings |
            ./Client/scripts/verify_device_dependency_search_paths.sh
      - name: Build unsigned iPad device app
        env:
          DERIVED_DATA: ${{ runner.temp }}/r3-device-derived-data
        run: |
          set -euo pipefail
          started_epoch=$(date +%s)
          rm -rf "$DERIVED_DATA"
          xcodebuild -project Client/iPadZeroLagDisplay/iPadCasting.xcodeproj \
            -scheme iPadCasting -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            TARGETED_DEVICE_FAMILY=2 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build \
            2>&1 | tee "$RUNNER_TEMP/r3-device-build.log"
          echo "DEVICE_APP_BUILD_SECONDS=$(( $(date +%s) - started_epoch ))"
          apps=()
          while IFS= read -r app; do apps[${#apps[@]}]="$app"; done < <(find "$DERIVED_DATA/Build/Products/Release-iphoneos" \
            -maxdepth 1 -type d -name '*.app' -print)
          [[ "${#apps[@]}" == 1 ]]
          [[ "$(basename "${apps[0]}")" == 'iPadCasting.app' ]]
          printf 'DEVICE_APP=%s\n' "${apps[0]}"
          echo "APP_PATH=${apps[0]}" >> "$GITHUB_ENV"
      - name: Validate unsigned iPad app
        env:
          EXPECTED_BUNDLE_IDENTIFIER: com.iPadZeroLagDisplay.client
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=("$APP_PATH")
          [[ "${#apps[@]}" == 1 && -d "${apps[0]}" ]]
          started_epoch=$(date +%s)
          EXPECTED_BUNDLE_IDENTIFIER="$EXPECTED_BUNDLE_IDENTIFIER" \
            ./Client/scripts/validate_unsigned_app.sh "${apps[0]}"
          echo "UNSIGNED_APP_VALIDATION_SECONDS=$(( $(date +%s) - started_epoch ))"
          echo 'UNSIGNED_APP_VALIDATION=PASS'
      - name: Create unsigned app provenance manifest
        id: app-manifest
        env:
          APP_ARTIFACT_ROOT: ${{ runner.temp }}/unsigned-app-artifact
          NATIVE_MANIFEST_SHA256: ${{ needs.prepare-native-deps.outputs.native_manifest_sha256 }}
        run: |
          set -euo pipefail
          rm -rf "$APP_ARTIFACT_ROOT"
          mkdir -p "$APP_ARTIFACT_ROOT"
          executable="$(plutil -extract CFBundleExecutable raw -o - "$APP_PATH/Info.plist")"
          bundle_id="$(plutil -extract CFBundleIdentifier raw -o - "$APP_PATH/Info.plist")"
          bundle_version="$(plutil -extract CFBundleVersion raw -o - "$APP_PATH/Info.plist")"
          short_version="$(plutil -extract CFBundleShortVersionString raw -o - "$APP_PATH/Info.plist")"
          [[ "$bundle_id" == 'com.iPadZeroLagDisplay.client' ]]
          [[ "$(lipo -archs "$APP_PATH/$executable")" == 'arm64' ]]
          cp -R "$APP_PATH" "$APP_ARTIFACT_ROOT/iPadCasting.app"
          manifest="$APP_ARTIFACT_ROOT/ScreenCasting-iPad-unsigned-app.manifest.txt"
          cat > "$manifest" <<EOF
          Manifest-Version: 1
          Product: ScreenCasting iPad Client
          Public SHA: $GITHUB_SHA
          CFBundleIdentifier: $bundle_id
          CFBundleVersion: $bundle_version
          CFBundleShortVersionString: $short_version
          Targeted Device Family: 2
          Architecture: arm64
          Signing: unsigned
          Native Dependencies Manifest SHA-256: $NATIVE_MANIFEST_SHA256
          Validation: PASS
          EOF
          grep -Fq "Public SHA: $GITHUB_SHA" "$manifest"
          manifest_sha256="$(shasum -a 256 "$manifest" | awk '{print $1}')"
          echo "manifest_sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"
          echo "APP_MANIFEST_SHA256=$manifest_sha256"
      - name: Upload unsigned iPad app artifact
        uses: actions/upload-artifact@v7
        with:
          name: ScreenCasting-iPad-unsigned-app
          path: ${{ runner.temp }}/unsigned-app-artifact
          if-no-files-found: error
          retention-days: 3

  package-unsigned-ipa:
    name: Package unsigned iPad IPA
    needs: build-unsigned-ipad-app
    if: ${{ needs.build-unsigned-ipad-app.result == 'success' }}
    runs-on: macos-15-intel
    timeout-minutes: 15
    outputs:
      final_manifest_sha256: ${{ steps.final-manifest.outputs.manifest_sha256 }}
      app_manifest_sha256: ${{ needs.build-unsigned-ipad-app.outputs.app_manifest_sha256 }}
      native_manifest_sha256: ${{ needs.build-unsigned-ipad-app.outputs.native_manifest_sha256 }}
    steps:
      - uses: actions/checkout@v7
      - name: Download unsigned iPad app artifact
        uses: actions/download-artifact@v8
        with:
          name: ScreenCasting-iPad-unsigned-app
          path: ${{ runner.temp }}/unsigned-app-download
      - name: Verify unsigned app provenance
        env:
          EXPECTED_APP_MANIFEST_SHA256: ${{ needs.build-unsigned-ipad-app.outputs.app_manifest_sha256 }}
          EXPECTED_NATIVE_MANIFEST_SHA256: ${{ needs.build-unsigned-ipad-app.outputs.native_manifest_sha256 }}
        run: |
          set -euo pipefail
          download_root="$RUNNER_TEMP/unsigned-app-download"
          apps=()
          while IFS= read -r app; do apps[${#apps[@]}]="$app"; done < <(find "$download_root" -type d -name '*.app' -print)
          manifests=()
          while IFS= read -r manifest; do manifests[${#manifests[@]}]="$manifest"; done < <(find "$download_root" -type f -name '*-app.manifest.txt' -print)
          [[ "${#apps[@]}" == 1 && "${#manifests[@]}" == 1 ]]
          app_path="${apps[0]}"
          manifest_path="${manifests[0]}"
          manifest_sha256="$(shasum -a 256 "$manifest_path" | awk '{print $1}')"
          [[ "$manifest_sha256" == "$EXPECTED_APP_MANIFEST_SHA256" ]]
          field() { awk -F': ' -v key="$1" '$1 == key { print substr($0, length($1) + 3); exit }' "$manifest_path"; }
          [[ "$(field 'Public SHA')" == "$GITHUB_SHA" ]]
          [[ "$(field 'Targeted Device Family')" == '2' ]]
          [[ "$(field 'Architecture')" == 'arm64' ]]
          [[ "$(field 'Native Dependencies Manifest SHA-256')" == "$EXPECTED_NATIVE_MANIFEST_SHA256" ]]
          EXPECTED_BUNDLE_IDENTIFIER=com.iPadZeroLagDisplay.client \
            ./Client/scripts/validate_unsigned_app.sh "$app_path"
          echo 'UNSIGNED_APP_ARTIFACT_PROVENANCE=PASS'
      - name: Package unsigned IPA
        env:
          IPA_PATH: ${{ runner.temp }}/ScreenCasting-iPad-unsigned.ipa
          PACKAGE_ROOT: ${{ runner.temp }}/r3-ipa-root
        run: |
          set -euo pipefail
          started_epoch=$(date +%s)
          app_path="$(find "$RUNNER_TEMP/unsigned-app-download" -type d -name '*.app' -print -quit)"
          rm -rf "$PACKAGE_ROOT" "$IPA_PATH"
          mkdir -p "$PACKAGE_ROOT/Payload"
          cp -R "$app_path" "$PACKAGE_ROOT/Payload/iPadCasting.app"
          (cd "$PACKAGE_ROOT" && zip -qry "$IPA_PATH" Payload)
          test -f "$IPA_PATH"
          echo "IPA_PACKAGE_SECONDS=$(( $(date +%s) - started_epoch ))"
          echo 'UNSIGNED_IPA_PACKAGING=PASS'
      - name: Validate packaged unsigned IPA
        env:
          IPA_PATH: ${{ runner.temp }}/ScreenCasting-iPad-unsigned.ipa
        run: |
          set -euo pipefail
          started_epoch=$(date +%s)
          EXPECTED_BUNDLE_IDENTIFIER=com.iPadZeroLagDisplay.client \
            ./Client/check_ipa.sh --unsigned "$IPA_PATH" | tee "$RUNNER_TEMP/r3-unsigned-validator.log"
          echo "IPA_VALIDATION_SECONDS=$(( $(date +%s) - started_epoch ))"
          echo 'UNSIGNED_IPA_VALIDATION=PASS'
      - name: Create unsigned IPA provenance manifest
        id: final-manifest
        env:
          IPA_PATH: ${{ runner.temp }}/ScreenCasting-iPad-unsigned.ipa
          APP_MANIFEST_SHA256: ${{ needs.build-unsigned-ipad-app.outputs.app_manifest_sha256 }}
          NATIVE_MANIFEST_SHA256: ${{ needs.build-unsigned-ipad-app.outputs.native_manifest_sha256 }}
          MANIFEST_PATH: ${{ runner.temp }}/ScreenCasting-iPad-unsigned.manifest.txt
        run: |
          set -euo pipefail
          ipa_sha256="$(shasum -a 256 "$IPA_PATH" | awk '{print $1}')"
          cat > "$MANIFEST_PATH" <<EOF
          Manifest-Version: 1
          Product: ScreenCasting iPad Client
          Public SHA: $GITHUB_SHA
          Workflow Run: $GITHUB_RUN_ID
          Configuration: Release
          Platform: iOS device
          Architecture: arm64
          Targeted Device Family: 2
          Signing: unsigned
          Validator: PASS
          App Manifest SHA-256: $APP_MANIFEST_SHA256
          Native Dependencies Manifest SHA-256: $NATIVE_MANIFEST_SHA256
          IPA filename: ScreenCasting-iPad-unsigned.ipa
          IPA SHA-256: $ipa_sha256
          EOF
          grep -Fq "Public SHA: $GITHUB_SHA" "$MANIFEST_PATH"
          grep -Fq "IPA SHA-256: $ipa_sha256" "$MANIFEST_PATH"
          manifest_sha256="$(shasum -a 256 "$MANIFEST_PATH" | awk '{print $1}')"
          echo "manifest_sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"
          echo "IPA_SHA256=$ipa_sha256"
          echo "FINAL_MANIFEST_SHA256=$manifest_sha256"
          echo 'SHA256_MANIFEST=PASS'
      - name: Upload unsigned iPad IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: ScreenCasting-iPad-unsigned
          path: |
            ${{ runner.temp }}/ScreenCasting-iPad-unsigned.ipa
            ${{ runner.temp }}/ScreenCasting-iPad-unsigned.manifest.txt
          if-no-files-found: error
          retention-days: 7

  revalidate-uploaded-ipa:
    name: Revalidate uploaded unsigned IPA
    needs: package-unsigned-ipa
    if: ${{ needs.package-unsigned-ipa.result == 'success' }}
    runs-on: macos-15-intel
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Download uploaded unsigned IPA artifact
        uses: actions/download-artifact@v8
        with:
          name: ScreenCasting-iPad-unsigned
          path: ${{ runner.temp }}/r3-downloaded
      - name: Revalidate downloaded unsigned IPA and SHA-256
        env:
          EXPECTED_FINAL_MANIFEST_SHA256: ${{ needs.package-unsigned-ipa.outputs.final_manifest_sha256 }}
          EXPECTED_APP_MANIFEST_SHA256: ${{ needs.package-unsigned-ipa.outputs.app_manifest_sha256 }}
          EXPECTED_NATIVE_MANIFEST_SHA256: ${{ needs.package-unsigned-ipa.outputs.native_manifest_sha256 }}
        run: |
          set -euo pipefail
          started_epoch=$(date +%s)
          download_root="$RUNNER_TEMP/r3-downloaded"
          ipas=()
          while IFS= read -r ipa; do ipas[${#ipas[@]}]="$ipa"; done < <(find "$download_root" -type f -name '*.ipa' -print)
          manifests=()
          while IFS= read -r manifest; do manifests[${#manifests[@]}]="$manifest"; done < <(find "$download_root" -type f -name '*.manifest.txt' -print)
          [[ "${#ipas[@]}" == 1 && "${#manifests[@]}" == 1 ]]
          ipa_path="${ipas[0]}"
          manifest_path="${manifests[0]}"
          actual_manifest_sha256="$(shasum -a 256 "$manifest_path" | awk '{print $1}')"
          [[ "$actual_manifest_sha256" == "$EXPECTED_FINAL_MANIFEST_SHA256" ]]
          field() { awk -F': ' -v key="$1" '$1 == key { print substr($0, length($1) + 3); exit }' "$manifest_path"; }
          expected_sha256="$(field 'IPA SHA-256')"
          actual_sha256="$(shasum -a 256 "$ipa_path" | awk '{print $1}')"
          [[ -n "$expected_sha256" && "$actual_sha256" == "$expected_sha256" ]]
          [[ "$(field 'Public SHA')" == "$GITHUB_SHA" ]]
          [[ "$(field 'Architecture')" == 'arm64' ]]
          [[ "$(field 'Targeted Device Family')" == '2' ]]
          [[ "$(field 'App Manifest SHA-256')" == "$EXPECTED_APP_MANIFEST_SHA256" ]]
          [[ "$(field 'Native Dependencies Manifest SHA-256')" == "$EXPECTED_NATIVE_MANIFEST_SHA256" ]]
          EXPECTED_BUNDLE_IDENTIFIER=com.iPadZeroLagDisplay.client \
            ./Client/check_ipa.sh --unsigned "$ipa_path"
          echo "DOWNLOADED_IPA_SHA256=$actual_sha256"
          echo "DOWNLOADED_ARTIFACT_REVALIDATION_SECONDS=$(( $(date +%s) - started_epoch ))"
          echo 'DOWNLOADED_ARTIFACT_REVALIDATION=PASS'

  c1-native-stability:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.c1_native_stability && !inputs.c1_extract_reports }}
    permissions:
      contents: read
      actions: read
    runs-on: macos-15-intel
    timeout-minutes: 360
    env:
      C1_BASELINE_REF: ${{ inputs.c1_baseline_ref }}
      C1_FOCUSED_LIFECYCLE: ${{ inputs.c1_focused_lifecycle }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Pin and record Xcode 16.4 and simulator runtime 18.5
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.build_unsigned_ipa }}" == false ]]
          [[ "${{ inputs.run_xctest }}" == false ]]
          export C1_EVIDENCE_ROOT="$RUNNER_TEMP/c1-native-stability-evidence"
          echo "C1_EVIDENCE_ROOT=$C1_EVIDENCE_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$C1_EVIDENCE_ROOT/entry"
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version | tee "$C1_EVIDENCE_ROOT/entry/xcode-version.txt"
          grep -qx 'Xcode 16.4' "$C1_EVIDENCE_ROOT/entry/xcode-version.txt"
          xcrun --sdk iphonesimulator --show-sdk-version | tee "$C1_EVIDENCE_ROOT/entry/simulator-sdk-version.txt"
          grep -qx '18.5' "$C1_EVIDENCE_ROOT/entry/simulator-sdk-version.txt"
          swift --version > "$C1_EVIDENCE_ROOT/entry/swift-version.txt"
          xcrun simctl list runtimes -j > "$C1_EVIDENCE_ROOT/entry/runtimes.json"
          xcrun simctl list devices available -j > "$C1_EVIDENCE_ROOT/entry/devices.json"
          python3 - <<'PY'
          import json, os, pathlib
          entry=pathlib.Path(os.environ['C1_EVIDENCE_ROOT'])/'entry'
          runtimes=json.loads((entry/'runtimes.json').read_text())['runtimes']
          runtime=next(x for x in runtimes if x['version']=='18.5' and x.get('isAvailable') and 'iOS' in x['name'])
          devices=json.loads((entry/'devices.json').read_text())['devices'][runtime['identifier']]
          device=sorted((x for x in devices if x.get('isAvailable') and 'iPad' in x['name']), key=lambda x:(x['name'],x['udid']))[0]
          (entry/'selected-simulator.json').write_text(json.dumps({'runtime':runtime,'device':device,'policy':'one UDID; no erase/reboot between variants or repetitions; single test worker'},indent=2))
          with open(os.environ['GITHUB_ENV'],'a') as env:env.write('C1_SIMULATOR_UDID='+device['udid']+'\n')
          PY
      - name: Download and verify the exact retained dependency archive
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11587506267" > "$C1_EVIDENCE_ROOT/entry/dependency-artifact.json"
          python3 - <<'PY'
          import json, os, pathlib
          x=json.loads((pathlib.Path(os.environ['C1_EVIDENCE_ROOT'])/'entry/dependency-artifact.json').read_text())
          assert x['id']==11587506267 and not x['expired']
          assert x['workflow_run']['id']==37862873695
          assert x['workflow_run']['head_sha']=='509c54fbb0f5d48bdf59cab71dea90667cbc9e30'
          assert x['digest']=='sha256:bdcf18ac31b0698e46651087164aaa739ed91c8004d293d8981f612df7583164'
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11587506267/zip" > "$RUNNER_TEMP/c1-native-deps.zip"
          printf '%s  %s\n' bdcf18ac31b0698e46651087164aaa739ed91c8004d293d8981f612df7583164 "$RUNNER_TEMP/c1-native-deps.zip" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/c1-native-deps"
          unzip -q "$RUNNER_TEMP/c1-native-deps.zip" -d "$RUNNER_TEMP/c1-native-deps"
          manifest=$(find "$RUNNER_TEMP/c1-native-deps" -name native-deps.manifest.txt -type f)
          test "$(printf '%s\n' "$manifest" | wc -l | tr -d ' ')" = 1
          cp "$manifest" "$C1_EVIDENCE_ROOT/entry/native-deps.manifest.txt"
          grep -qx 'Native Output Tree SHA-256: 6030659b9b2824340d07692e6b9a4fad68070bb8538bf9e2c36f587763cb11c5' "$manifest"
          export EXPECTED_PUBLIC_SHA=509c54fbb0f5d48bdf59cab71dea90667cbc9e30
          export EXPECTED_CACHE_KEY=$(sed -n 's/^Cache Key: //p' "$manifest")
          export EXPECTED_MANIFEST_SHA256=$(shasum -a 256 "$manifest" | awk '{print $1}')
          bash Client/scripts/verify_native_dependency_artifact.sh "$RUNNER_TEMP/c1-native-deps" "$GITHUB_WORKSPACE/Client/ThirdPartyBuild" 2>&1 | tee "$C1_EVIDENCE_ROOT/entry/dependency-verification.log"
          bash Client/scripts/verify_ios_dependency_artifacts.sh "$GITHUB_WORKSPACE/Client/ThirdPartyBuild/xcframeworks" "$GITHUB_WORKSPACE/Client/ThirdPartyBuild/build" 2>&1 | tee "$C1_EVIDENCE_ROOT/entry/dependency-strict-validation.log"
      - name: Boot the single matched simulator
        shell: bash
        run: |
          set -euo pipefail
          state=$(xcrun simctl list devices -j | python3 -c 'import json,os,sys; d=json.load(sys.stdin); print(next(x["state"] for group in d["devices"].values() for x in group if x["udid"]==os.environ["C1_SIMULATOR_UDID"]))')
          if [[ "$state" != Booted ]]; then xcrun simctl boot "$C1_SIMULATOR_UDID"; fi
          xcrun simctl bootstatus "$C1_SIMULATOR_UDID" -b > "$C1_EVIDENCE_ROOT/entry/simulator-boot.log" 2>&1
      - name: Matched N0 N1 S1 S2 and ordered-pair diagnostics
        shell: bash
        timeout-minutes: 300
        run: |
          set -euo pipefail
          python3 Client/scripts/run_c1_heap_classification.py 2>&1 | tee "$C1_EVIDENCE_ROOT/campaign.stdout-stderr.log"
      - name: Retain final crash and simulator diagnostics even after failure
        if: always()
        shell: bash
        run: |
          set -u
          C1_EVIDENCE_ROOT="${C1_EVIDENCE_ROOT:-$RUNNER_TEMP/c1-native-stability-evidence}"
          mkdir -p "$C1_EVIDENCE_ROOT/final-diagnostics"
          if [[ -n "${C1_SIMULATOR_UDID:-}" ]]; then
            xcrun simctl spawn "$C1_SIMULATOR_UDID" log show --last 10m --style compact > "$C1_EVIDENCE_ROOT/final-diagnostics/simulator-unified.log" 2>&1 || true
            source="$HOME/Library/Developer/CoreSimulator/Devices/$C1_SIMULATOR_UDID/data/Library/Logs"
            if [[ -d "$source" ]]; then cp -R "$source" "$C1_EVIDENCE_ROOT/final-diagnostics/simulator-logs"; fi
          fi
          if [[ -d "$HOME/Library/Logs/DiagnosticReports" ]]; then cp -R "$HOME/Library/Logs/DiagnosticReports" "$C1_EVIDENCE_ROOT/final-diagnostics/host-crash-reports"; fi
      - name: Always upload native XCTest stability evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: C1-native-stability-${{ github.run_id }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/c1-native-stability-evidence/entry
            ${{ runner.temp }}/c1-native-stability-evidence/N0
            ${{ runner.temp }}/c1-native-stability-evidence/N1
            ${{ runner.temp }}/c1-native-stability-evidence/S1
            ${{ runner.temp }}/c1-native-stability-evidence/S2
            ${{ runner.temp }}/c1-native-stability-evidence/sequences
            ${{ runner.temp }}/c1-native-stability-evidence/full
            ${{ runner.temp }}/c1-native-stability-evidence/sources/*-source-manifest.json
            ${{ runner.temp }}/c1-native-stability-evidence/sources/*-test-input-manifest.json
            ${{ runner.temp }}/c1-native-stability-evidence/final-diagnostics
            ${{ runner.temp }}/c1-native-stability-evidence/*.json
            ${{ runner.temp }}/c1-native-stability-evidence/*.txt
            ${{ runner.temp }}/c1-native-stability-evidence/*.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  c1-extract-reports:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.c1_native_stability && inputs.c1_extract_reports }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require diagnostic-only extraction
        env:
          BUILD_IPA: ${{ inputs.build_unsigned_ipa }}
          RUN_TESTS: ${{ inputs.run_xctest }}
        run: test "$BUILD_IPA" = false && test "$RUN_TESTS" = false
      - name: Verify completed diagnostic run identity
        id: source
        env:
          SOURCE_RUN: ${{ inputs.c1_extract_source_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > /tmp/c1-source-run.json
          python3 - <<'PY'
          import json, os
          run=json.load(open('/tmp/c1-source-run.json'))
          assert str(run['id'])==os.environ['SOURCE_RUN']
          assert run['status']=='completed' and run['event']=='workflow_dispatch'
          assert run['head_branch']=='codex/keyboard-v1-validation'
          assert run['path']=='.github/workflows/ios-public-ci.yml'
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('sha='+run['head_sha']+'\n')
          PY
      - name: Download the exact retained completed native evidence
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.c1_extract_source_run }}
          name: C1-native-stability-${{ inputs.c1_extract_source_run }}-${{ steps.source.outputs.sha }}
          path: /tmp/c1-retained
      - name: Extract exact diagnostic reports and preserve source hashes
        run: |
          python3 - <<'PY'
          import pathlib, hashlib, json, shutil
          root=pathlib.Path('/tmp/c1-retained'); out=pathlib.Path('/tmp/c1-reports'); out.mkdir()
          manifest=[]; observed=set()
          for file in sorted(root.rglob('*')):
              if not file.is_file() or 'symbols' in file.relative_to(root).parts: continue
              relative=file.relative_to(root)
              if file.suffix not in ['.json','.log','.txt','.ips','.crash']: continue
              if file.stat().st_size > 8_000_000: continue
              data=file.read_bytes(); sha=hashlib.sha256(data).hexdigest()
              if file.suffix in ['.ips','.crash']:
                  destination=out/'crashes'/(sha+file.suffix)
              else: destination=out/relative
              destination.parent.mkdir(parents=True,exist_ok=True)
              if not destination.exists(): destination.write_bytes(data)
              manifest.append({'source':str(relative),'retained':str(destination.relative_to(out)),'sourceSha256':sha,'bytes':len(data)})
              if file.name in ['classification.json','xcresult-summary.json.log']:
                  print('=== REPORT '+str(relative)+' ===',flush=True)
                  print(data.decode('utf-8',errors='replace')[:24000],flush=True)
              if file.suffix in ['.ips','.crash'] and sha not in observed:
                  observed.add(sha)
                  text=data.decode('utf-8',errors='replace')
                  if 'iPadCasting' in text:
                      print('=== CRASH '+str(relative)+' SHA256 '+sha+' ===',flush=True)
                      print(text[:50000],flush=True)
          (out/'retained-source-manifest.json').write_text(json.dumps(manifest,indent=2))
          print('Retained',len(manifest),'reports;',len(observed),'unique crash reports',flush=True)
          PY
      - name: Retain the small exact diagnostic report bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: C1-extracted-reports-${{ inputs.c1_extract_source_run }}-${{ github.run_id }}
          path: /tmp/c1-reports
          if-no-files-found: error
          retention-days: 14
