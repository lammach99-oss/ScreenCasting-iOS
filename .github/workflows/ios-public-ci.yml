name: iOS public CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_unsigned_ipa:
        description: Build and upload unsigned iPad IPA
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and XCTest
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Verify iPad-only target
        run: ./Client/scripts/verify_ipad_target.sh
      - name: Verify identity persistence boundary
        run: |
          if grep -En 'UserDefaults|FileManager|NSKeyedArchiver|write\(to:' Client/iPadZeroLagDisplay/USBServerIdentity.swift; then
            echo 'USB identity must remain Security/Keychain-backed' >&2
            exit 1
          fi
          grep -q 'SystemKeychainBackend' Client/iPadZeroLagDisplay/USBServerIdentity.swift
          if grep -En 'testRecover\(|TestRecoveryState|testCertificateInsertStatus' Client/iPadZeroLagDisplay/USBServerIdentity.swift Client/iPadZeroLagDisplayTests/USBServerIdentityTests.swift; then
            echo 'disconnected recovery test seam remains' >&2
            exit 1
          fi
      - name: Run deterministic IPA validator fixtures
        run: ./Client/scripts/test_check_ipa.sh
      - name: Run deterministic device dependency search fixtures
        run: ./Client/scripts/test_verify_device_dependency_search_paths.sh
      - name: Build pinned native dependencies
        run: ./Client/scripts/build_ios_dependencies.sh
      - name: Verify dependency artifacts
        run: |
          cache_root="${SCREENCASTING_DEP_CACHE:-${TMPDIR:-/tmp}/screencasting-ios-deps}"
          ./Client/scripts/verify_ios_dependency_artifacts.sh \
            "$GITHUB_WORKSPACE/Client/ThirdPartyBuild/xcframeworks" \
            "$cache_root/build"
      - name: Build unsigned iOS Simulator app
        run: >-
          xcodebuild -project Client/iPadZeroLagDisplay/iPadCasting.xcodeproj
          -scheme iPadCasting -destination 'generic/platform=iOS Simulator'
          ARCHS=x86_64 ONLY_ACTIVE_ARCH=YES
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Run XCTest
        run: |
          destination=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(("platform=iOS Simulator,id="+device["udid"]+",arch=x86_64" for devices in data.get("devices", {}).values() for device in devices if device.get("isAvailable") and "iPad" in device.get("name", "")), ""))')
          test -n "$destination"
          xcodebuild test -project Client/iPadZeroLagDisplay/iPadCasting.xcodeproj \
            -scheme iPadCasting -destination "$destination" \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

  unsigned-ipad-ipa:
    name: Unsigned iPad IPA
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.build_unsigned_ipa == true && needs.test.result == 'success'
    runs-on: macos-15-intel
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Verify iPad-only target
        run: ./Client/scripts/verify_ipad_target.sh
      - name: Build pinned native dependencies for device
        run: ./Client/scripts/build_ios_dependencies.sh
      - name: Verify device and simulator dependency slices
        run: |
          cache_root="${SCREENCASTING_DEP_CACHE:-${TMPDIR:-/tmp}/screencasting-ios-deps}"
          ./Client/scripts/verify_ios_dependency_artifacts.sh \
            "$GITHUB_WORKSPACE/Client/ThirdPartyBuild/xcframeworks" \
            "$cache_root/build"
          echo 'DEVICE_DEPENDENCY_VARIANTS=OpenSSLCrypto:arm64,libsrtp2:arm64,libopus:arm64'
          echo 'SIMULATOR_DEPENDENCY_VARIANTS=OpenSSLCrypto:x86_64,libsrtp2:x86_64,libopus:x86_64'
      - name: Verify device dependency search paths
        run: |
          set -euo pipefail
          xcodebuild -project Client/iPadZeroLagDisplay/iPadCasting.xcodeproj \
            -scheme iPadCasting -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -showBuildSettings |
            ./Client/scripts/verify_device_dependency_search_paths.sh
      - name: Build unsigned iPad device app
        env:
          DERIVED_DATA: ${{ runner.temp }}/r3-device-derived-data
        run: |
          set -euo pipefail
          rm -rf "$DERIVED_DATA"
          xcodebuild -project Client/iPadZeroLagDisplay/iPadCasting.xcodeproj \
            -scheme iPadCasting -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build \
            2>&1 | tee "$RUNNER_TEMP/r3-device-build.log"
          mapfile -t apps < <(find "$DERIVED_DATA/Build/Products/Release-iphoneos" \
            -maxdepth 1 -type d -name '*.app' -print)
          [[ "${#apps[@]}" == 1 ]]
          [[ "$(basename "${apps[0]}")" == 'iPadCasting.app' ]]
          printf 'DEVICE_APP=%s\n' "${apps[0]}"
      - name: Validate unsigned iPad app before packaging
        env:
          DERIVED_DATA: ${{ runner.temp }}/r3-device-derived-data
        run: |
          shopt -s nullglob
          apps=("$DERIVED_DATA/Build/Products/Release-iphoneos"/*.app)
          [[ "${#apps[@]}" == 1 ]]
          EXPECTED_BUNDLE_IDENTIFIER=com.iPadZeroLagDisplay.client \
            ./Client/scripts/validate_unsigned_app.sh "${apps[0]}"
      - name: Package unsigned iPad IPA
        env:
          DERIVED_DATA: ${{ runner.temp }}/r3-device-derived-data
          IPA_PATH: ${{ runner.temp }}/ScreenCasting-iPad-unsigned.ipa
          PACKAGE_ROOT: ${{ runner.temp }}/r3-ipa-root
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=("$DERIVED_DATA/Build/Products/Release-iphoneos"/*.app)
          [[ "${#apps[@]}" == 1 ]]
          rm -rf "$PACKAGE_ROOT" "$IPA_PATH"
          mkdir -p "$PACKAGE_ROOT/Payload"
          cp -R "${apps[0]}" "$PACKAGE_ROOT/Payload/iPadCasting.app"
          (cd "$PACKAGE_ROOT" && zip -qry "$IPA_PATH" Payload)
          test -f "$IPA_PATH"
          echo 'UNSIGNED_IPA_PACKAGING=PASS'
      - name: Validate packaged unsigned IPA
        env:
          IPA_PATH: ${{ runner.temp }}/ScreenCasting-iPad-unsigned.ipa
        run: |
          EXPECTED_BUNDLE_IDENTIFIER=com.iPadZeroLagDisplay.client \
            ./Client/check_ipa.sh --unsigned "$IPA_PATH" | tee "$RUNNER_TEMP/r3-unsigned-validator.log"
          echo 'UNSIGNED_IPA_VALIDATION=PASS'
      - name: Create unsigned IPA provenance manifest
        env:
          IPA_PATH: ${{ runner.temp }}/ScreenCasting-iPad-unsigned.ipa
          MANIFEST_PATH: ${{ runner.temp }}/ScreenCasting-iPad-unsigned.manifest.txt
        run: |
          set -euo pipefail
          ipa_sha256="$(shasum -a 256 "$IPA_PATH" | awk '{print $1}')"
          cat > "$MANIFEST_PATH" <<EOF
          Product: ScreenCasting iPad Client
          Public SHA: $GITHUB_SHA
          Workflow Run: $GITHUB_RUN_ID
          Configuration: Release
          Platform: iOS device
          Architecture: arm64
          Targeted Device Family: 2
          Signing: unsigned
          Validator: PASS
          OpenSSL pin: openssl-3.3.2 (tag object 98b3bf1433f8f4a29e64ca8b9bd42c58d3d1b98a)
          libsrtp pin: 24b3bf8f19b6f5ab4cd2bcceb4f4064efca86fd5
          Opus pin: ddbe48383984d56acd9e1ab6a090c54ca6b735a6
          IPA filename: ScreenCasting-iPad-unsigned.ipa
          IPA SHA-256: $ipa_sha256
          EOF
          grep -Fq "Public SHA: $GITHUB_SHA" "$MANIFEST_PATH"
          grep -Fq "IPA SHA-256: $ipa_sha256" "$MANIFEST_PATH"
          echo "IPA_SHA256=$ipa_sha256"
          echo 'SHA256_MANIFEST=PASS'
      - name: Upload unsigned iPad IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenCasting-iPad-unsigned
          path: |
            ${{ runner.temp }}/ScreenCasting-iPad-unsigned.ipa
            ${{ runner.temp }}/ScreenCasting-iPad-unsigned.manifest.txt
          if-no-files-found: error
          retention-days: 7

  revalidate-unsigned-artifact:
    name: Revalidate uploaded unsigned IPA
    needs: unsigned-ipad-ipa
    if: needs.unsigned-ipad-ipa.result == 'success'
    runs-on: macos-15-intel
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download uploaded unsigned IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: ScreenCasting-iPad-unsigned
          path: ${{ runner.temp }}/r3-downloaded
      - name: Revalidate downloaded unsigned IPA and SHA-256
        run: |
          set -euo pipefail
          download_root="${{ runner.temp }}/r3-downloaded"
          mapfile -t ipas < <(find "$download_root" -type f -name '*.ipa' -print)
          mapfile -t manifests < <(find "$download_root" -type f -name '*.manifest.txt' -print)
          [[ "${#ipas[@]}" == 1 && "${#manifests[@]}" == 1 ]]
          ipa_path="${ipas[0]}"
          manifest_path="${manifests[0]}"
          expected_sha256="$(awk -F': ' '$1 == "IPA SHA-256" {print $2; exit}' "$manifest_path")"
          actual_sha256="$(shasum -a 256 "$ipa_path" | awk '{print $1}')"
          [[ -n "$expected_sha256" && "$actual_sha256" == "$expected_sha256" ]]
          expected_public_sha="$(awk -F': ' '$1 == "Public SHA" {print $2; exit}' "$manifest_path")"
          [[ "$expected_public_sha" == "$GITHUB_SHA" ]]
          output="$(./Client/check_ipa.sh --unsigned "$ipa_path")"
          grep -Fq 'CODE_SIGNATURE=NOT_REQUIRED_UNSIGNED_MODE' <<<"$output"
          grep -Fq 'PROVISIONING_PROFILE=NOT_REQUIRED_UNSIGNED_MODE' <<<"$output"
          echo "DOWNLOADED_IPA_SHA256=$actual_sha256"
          echo 'DOWNLOADED_ARTIFACT_REVALIDATION=PASS'
