name: WanQuicInterop
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
targets:
  WanQuicInterop:
    type: application
    platform: iOS
    sources: [WanQuicInterop]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.screencasting.tools.wanquicinterop
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Isolated QUIC interoperability test
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  WanQuicInteropTests:
    type: bundle.unit-test
    platform: iOS
    sources: [WanQuicInteropTests]
    dependencies:
      - target: WanQuicInterop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.screencasting.tools.wanquicinterop.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  WanQuicInterop:
    build:
      targets:
        WanQuicInterop: all
    test:
      targets: [WanQuicInteropTests]