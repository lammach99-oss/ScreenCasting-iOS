name: MinimalQuicRepro
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
targets:
  MinimalQuicRepro:
    type: application
    platform: iOS
    sources: [MinimalQuicRepro]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.screencasting.tools.quicminimalrepro
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Minimal isolated QUIC diagnostic
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ReproSourceSHA: "$(REPRO_SOURCE_SHA)"
        INFOPLIST_KEY_ReproXcode: "$(XCODE_VERSION_ACTUAL)"
        INFOPLIST_KEY_ReproSDK: "$(SDK_VERSION)"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
  MinimalQuicReproTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MinimalQuicReproTests]
    dependencies:
      - target: MinimalQuicRepro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.screencasting.tools.quicminimalrepro.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MinimalQuicRepro:
    build:
      targets:
        MinimalQuicRepro: all
    test:
      targets: [MinimalQuicReproTests]
