name: MinimalQuicRepro
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
targets:
  MinimalQuicRepro:
    type: application
    platform: iOS
    sources: [MinimalQuicRepro]
    info:
      path: Generated/MinimalInfo.plist
      properties:
        NSLocalNetworkUsageDescription: Minimal isolated QUIC diagnostic
        UILaunchScreen: {}
        ReproSourceSHA: "$(REPRO_SOURCE_SHA)"
        ReproXcode: "16.4 (16F6)"
        ReproSDK: "iphoneos18.5"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.screencasting.tools.quicminimalrepro
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
  MinimalQuicReproTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MinimalQuicReproTests]
    dependencies:
      - target: MinimalQuicRepro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.screencasting.tools.quicminimalrepro.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MinimalQuicRepro:
    build:
      targets:
        MinimalQuicRepro: all
    test:
      targets: [MinimalQuicReproTests]
